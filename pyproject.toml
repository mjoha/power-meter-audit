[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-meter-audit"
version = "0.3.0"
description = "Find inconsistent power readings across cycling FIT activities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fitparse>=1.2.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
# Only needed to talk to real hardware; the simulator and analysis run without them.
hardware = [
  # Verified against bleak 3.0.2 / pycycling 0.4.1 / openant 1.3.4. Capped
  # because bleak makes breaking changes on majors and pycycling tracks it.
  "bleak>=0.22,<4",
  "pycycling>=0.4.1",
  "openant>=1.3",
]
ui = ["aiohttp>=3.9"]
app = [
  "bleak>=0.22,<4",
  "pycycling>=0.4.1",
  "openant>=1.3",
  "aiohttp>=3.9",
]

[project.scripts]
power-meter-audit = "power_meter_audit.cli:main"
power-meter-compare = "power_meter_audit.compare_cli:main"
power-meter-ui = "power_meter_audit.compare_cli:ui_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["power_meter_audit*"]

[tool.setuptools.package-data]
"power_meter_audit.live.webui" = ["static/*"]

